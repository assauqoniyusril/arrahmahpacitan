name: reportase-foto-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reportase_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      APP_PORT: 8005
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - go_modules:/go/pkg/mod
    ports:
      - "8005:8005"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - reportase_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3004:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reportase_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${DEV_PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - reportase_net

volumes:
  postgres_data:
  go_modules:
  frontend_node_modules:

networks:
  reportase_net:
    driver: bridge
